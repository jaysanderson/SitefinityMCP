# Fly.io configuration for the Sitefinity MCP server.
# App name is set at launch; deploy with `fly deploy`.

app = "sitefinity-mcp-eftm2"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "http"
  HOST = "0.0.0.0"
  PORT = "8080"
  SITEFINITY_BASE_URL = "https://sta.eftm2.cloud.sitefinity.com"
  SITEFINITY_SERVICE_NAME = "default"
  SITEFINITY_AUTH_MODE = "anonymous"
  ARAG_REGION = "aws-us-east-2-1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
